<!DOCTYPE html>
<html>
<head>
    <title>QuickBite AI Support</title>
    <script src="https://cdn.vapi.ai/web.js"></script>

    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(120deg, #f0f6ff, #dce9ff);
            text-align: center;
        }

        .container {
            margin-top: 80px;
        }

        h1 {
            font-size: 48px;
            color: #1a1a1a;
        }

        h1 span {
            color: #007bff;
        }

        p {
            font-size: 18px;
            color: #555;
        }

        .card {
            background: white;
            width: 400px;
            margin: 40px auto;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .features {
            margin-top: 20px;
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .feature {
            background: #f1f5ff;
            padding: 10px 18px;
            border-radius: 20px;
            font-size: 14px;
        }

        .mic-btn {
            margin-top: 25px;
            background: #007bff;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 50px;
            cursor: pointer;
            transition: 0.3s;
        }

        .mic-btn:hover {
            background: #0056d2;
            transform: scale(1.05);
        }

        footer {
            margin-top: 80px;
            font-size: 14px;
            color: gray;
        }
    </style>
</head>

<body>

<div class="container">
    <h1>Need help with your order? <br><span>Just speak.</span></h1>
    <p>Our AI assistant handles order tracking, refunds & delivery issues instantly.</p>

    <div class="card">
        <h2>🎙️ Talk to QuickBite AI</h2>
        <p>Click below and start speaking</p>

        <div class="features">
            <div class="feature">📦 Order Status</div>
            <div class="feature">❌ Missing Items</div>
            <div class="feature">💰 Refunds</div>
        </div>

        <button class="mic-btn" onclick="startCall()">Start Voice Support</button>
    </div>
</div>

<footer>
    © 2026 QuickBite AI Support
</footer>

<script>
    const vapi = new Vapi("c9d74b4a-b412-4fd0-a741-fe45f2524d68");

    function startCall() {
        vapi.start({
            assistantId: "17bbd5d0-8a54-4d47-a748-905cbed8660f"
        });
    }
</script>

</body>
</html>
